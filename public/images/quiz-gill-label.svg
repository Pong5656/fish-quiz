<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="ภาพข้อสอบ: โครงสร้างเหงือกปลา มีลูกศรชี้โครงกระดูกเหงือก ฟิลาเมนต์ และแผ่นเหงือก">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4e6c8"/>
      <stop offset="100%" stop-color="#d9c39a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>
  <g stroke="#eef3f7" stroke-width="1">
    <path d="M0 125h900M0 250h900M0 375h900M150 0v500M300 0v500M450 0v500M600 0v500M750 0v500"/>
  </g>

  <!-- โครงเหงือก 4 คู่ -->
  <g transform="translate(120,90)">
    <g>
      <!-- ซี่โครงเหงือกโค้ง -->
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="#b99a63" stroke-width="2"/>
      <!-- ฟิลาเมนต์ยื่นขึ้น -->
      <g stroke="#3fa2c8" stroke-width="4" stroke-linecap="round">
        <path d="M85 32 L82 -34"/><path d="M120 20 L120 -46"/><path d="M160 13 L163 -52"/>
        <path d="M200 12 L207 -51"/><path d="M240 22 L250 -40"/><path d="M270 42 L282 -18"/>
      </g>
      <!-- แผ่นเหงือกยื่นออกข้าง -->
      <g stroke="#7bc4de" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
        <path d="M120 -20 L100 -30"/><path d="M120 -20 L140 -30"/>
        <path d="M163 -26 L143 -36"/><path d="M163 -26 L183 -36"/>
        <path d="M207 -25 L187 -35"/><path d="M207 -25 L227 -35"/>
      </g>
    </g>
    <g transform="translate(0,140)">
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="#b99a63" stroke-width="2"/>
      <g stroke="#3fa2c8" stroke-width="4" stroke-linecap="round">
        <path d="M85 32 L82 -34"/><path d="M120 20 L120 -46"/><path d="M160 13 L163 -52"/>
        <path d="M200 12 L207 -51"/><path d="M240 22 L250 -40"/><path d="M270 42 L282 -18"/>
      </g>
    </g>
    <g transform="translate(430,40)">
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="#b99a63" stroke-width="2"/>
      <g stroke="#3fa2c8" stroke-width="4" stroke-linecap="round">
        <path d="M85 32 L82 -34"/><path d="M120 20 L120 -46"/><path d="M160 13 L163 -52"/>
        <path d="M200 12 L207 -51"/><path d="M240 22 L250 -40"/><path d="M270 42 L282 -18"/>
      </g>
    </g>
    <g transform="translate(430,180)">
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
      <path d="M60 40 C120 10, 220 10, 280 60" fill="none" stroke="#b99a63" stroke-width="2"/>
      <g stroke="#3fa2c8" stroke-width="4" stroke-linecap="round">
        <path d="M85 32 L82 -34"/><path d="M120 20 L120 -46"/><path d="M160 13 L163 -52"/>
        <path d="M200 12 L207 -51"/><path d="M240 22 L250 -40"/><path d="M270 42 L282 -18"/>
      </g>
    </g>
  </g>

  <!-- ลูกศร A B C -->
  <g stroke="#b91c1c" stroke-width="2.6" fill="none">
    <path d="M60 380 L60 330"/>
    <path d="M54 338 L60 330 L66 338"/>
    <path d="M360 60 L360 24"/>
    <path d="M354 32 L360 24 L366 32"/>
    <path d="M520 445 L520 415"/>
    <path d="M514 423 L520 415 L526 423"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">
    <text x="70" y="400">A</text>
    <text x="370" y="22">B</text>
    <text x="530" y="464">C</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="499" fill="none" stroke="#cbd5e1"/>
</svg>
