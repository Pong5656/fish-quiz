<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="แผนภาพแสดงส่วนประกอบภายนอกและตำแหน่งครีบของปลา">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bc4de"/>
      <stop offset="55%" stop-color="#3fa2c8"/>
      <stop offset="100%" stop-color="#1f5776"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0ddec"/>
      <stop offset="100%" stop-color="#2485ad"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#eaeff4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="500" fill="#fbf9f4"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- แนวน้ำ -->
  <path d="M0 300h900" stroke="#d5eef5" stroke-width="2" stroke-dasharray="8 8"/>

  <g transform="translate(60,150)">
    <!-- ครีบหลัง -->
    <path d="M300 40 L380 -30 L430 10 L440 45 Z" fill="url(#fin)" stroke="#1f5776" stroke-width="2.5"/>
    <!-- ตัว -->
    <path d="M120 70 C170 0, 480 -20, 640 60 C700 90, 700 130, 640 160 C480 240, 170 220, 120 150 C105 128, 105 92, 120 70 Z"
          fill="url(#body)" stroke="#1f5776" stroke-width="3"/>
    <!-- ครีบอก -->
    <path d="M280 165 C300 230, 360 250, 400 225 C370 195, 330 160, 300 155 Z"
          fill="url(#fin)" stroke="#1f5776" stroke-width="2.5"/>
    <!-- ครีบท้อง -->
    <path d="M400 200 C415 245, 450 258, 480 240 C458 214, 430 198, 410 194 Z"
          fill="url(#fin)" stroke="#1f5776" stroke-width="2.5"/>
    <!-- ครีบก้น -->
    <path d="M560 195 C580 240, 620 250, 645 228 C622 205, 595 190, 570 188 Z"
          fill="url(#fin)" stroke="#1f5776" stroke-width="2.5"/>
    <!-- ครีบหาง -->
    <path d="M640 60 C710 30, 790 -10, 815 40 C790 105, 720 120, 660 130
             C720 140, 790 155, 815 220 C790 270, 710 230, 640 160 Z"
          fill="url(#fin)" stroke="#1f5776" stroke-width="3"/>
    <!-- เหงือก -->
    <path d="M190 45 C165 90, 165 140, 190 180" fill="none" stroke="#0f2836" stroke-width="3" opacity="0.55"/>
    <path d="M215 45 C190 90, 190 140, 215 180" fill="none" stroke="#0f2836" stroke-width="3" opacity="0.35"/>
    <!-- ตา -->
    <circle cx="185" cy="95" r="19" fill="#ffffff" stroke="#1f5776" stroke-width="2.5"/>
    <circle cx="188" cy="95" r="9" fill="#0f2836"/>
    <circle cx="191" cy="91" r="3" fill="#ffffff"/>
    <!-- ปาก -->
    <path d="M118 108 C138 100, 148 112, 140 124" fill="none" stroke="#0f2836" stroke-width="3.5" stroke-linecap="round"/>
    <!-- เส้นข้าง -->
    <path d="M235 120 C360 108, 520 112, 645 118" fill="none" stroke="#d5eef5" stroke-width="3" stroke-dasharray="10 7" opacity="0.9"/>
    <!-- เกล็ด -->
    <g fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.4">
      <path d="M330 90 q18 -22 36 0 q-18 22 -36 0"/>
      <path d="M400 80 q18 -22 36 0 q-18 22 -36 0"/>
      <path d="M470 82 q18 -22 36 0 q-18 22 -36 0"/>
      <path d="M330 150 q18 22 36 0 q-18 -22 -36 0"/>
      <path d="M400 160 q18 22 36 0 q-18 -22 -36 0"/>
      <path d="M470 158 q18 22 36 0 q-18 -22 -36 0"/>
    </g>
  </g>

  <!-- ป้ายกำกับ -->
  <g font-family="system-ui, sans-serif" font-size="15" fill="#323e49">
    <line x1="370" y1="118" x2="370" y2="72" stroke="#2485ad" stroke-width="1.6"/>
    <text x="380" y="68" fill="#1f5776" font-weight="600">ครีบหลัง (dorsal)</text>

    <line x1="430" y1="330" x2="430" y2="372" stroke="#2485ad" stroke-width="1.6"/>
    <text x="440" y="388" fill="#1f5776" font-weight="600">ครีบอก (pectoral)</text>

    <line x1="510" y1="365" x2="510" y2="408" stroke="#2485ad" stroke-width="1.6"/>
    <text x="520" y="424" fill="#1f5776" font-weight="600">ครีบท้อง (pelvic)</text>

    <line x1="660" y1="360" x2="660" y2="404" stroke="#2485ad" stroke-width="1.6"/>
    <text x="670" y="420" fill="#1f5776" font-weight="600">ครีบก้น (anal)</text>

    <line x1="820" y1="130" x2="860" y2="100" stroke="#2485ad" stroke-width="1.6"/>
    <text x="700" y="92" fill="#1f5776" font-weight="600" text-anchor="middle">ครีบหาง (caudal)</text>

    <line x1="245" y1="245" x2="205" y2="300" stroke="#2485ad" stroke-width="1.6"/>
    <text x="120" y="318" fill="#1f5776" font-weight="600">ครีบอก</text>
    <text x="120" y="338" fill="#627d94" font-size="12.5">ครีบคู่ รวม 4 ครีบ</text>

    <line x1="205" y1="110" x2="120" y2="88" stroke="#2485ad" stroke-width="1.6"/>
    <text x="30" y="82" fill="#1f5776" font-weight="600">ตา</text>

    <text x="30" y="446" fill="#627d94" font-size="13">จุดแบ่งหัว–ลำตัว = ขอบหลังของกระดูกแผ่นปิดเหงือก</text>
    <text x="30" y="468" fill="#627d94" font-size="13">จุดแบ่งลำตัว–หาง = ทวารหนัก หรือโคนครีบก้น</text>
  </g>
</svg>
